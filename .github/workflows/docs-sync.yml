name: Sync docs to Scribe

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
    paths:
      - docs/**
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Request OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("https://scribe.rambleventures.com");
            core.setOutput("token", token);

      - name: Trigger Scribe sync
        env:
          SCRIBE_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          curl --fail-with-body --max-time 300 --connect-timeout 10 \
            -X POST "https://scribe.rambleventures.com/api/github/sync/publishpress-cart" \
            -H "Authorization: Bearer ${SCRIBE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"${GITHUB_REF}\"}"
