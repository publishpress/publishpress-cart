name: Enforce code standards and compatibility

permissions:
  contents: read

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  language-pack-packaging:
    name: Check language-pack packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - run: bash tests/language-pack-packaging.sh

  check:
    uses: publishpress/github-workflows/.github/workflows/code-standards.yml@v3
