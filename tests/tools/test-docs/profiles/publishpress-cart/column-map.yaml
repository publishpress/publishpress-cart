purchase_type_map:
  One-time payment: one-time
  One-time payment + bump: one-time
  Subscription: subscription
  Free product: free
  Multiple plans: one-time
  Payment plan: one-time

tax_context_map:
  None: none
  No tax: none
  Varies: none
  Tax may vary: none
  VAT enabled: vat
  Tax/VAT enabled: vat
  Tax enabled: tax-exclusive
  Tax rate enabled: tax-exclusive

priority_map:
  Critical: critical
  High: high
  Medium: medium
  Low: low
