# TEMPORARY migration dictionary — Ghost Inspector (.side) -> current Playwright regression specs.
#
# Ghost Inspector exports carry the legacy code in the test name, e.g.
#   "[StudioCart] TC-001 Critical - <name>"  /  "[StudioCartPro] TC-024 Smoke - <name>"
# The regression suite was renamed TC- -> RT- (numbers preserved).
#
# IMPORTANT: some Ghost Inspector suites REUSE the same number for different scenarios,
# so match on the full test NAME (slug), not on the code alone.
#
# Remove this file once the side-to-playwright migration is complete.
